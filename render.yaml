services:
  - type: web
    name: winit
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WINIT_TRUST_PROXY
        value: "1"
      - key: PORT
        value: "3000"
