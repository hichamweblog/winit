<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1A20">
  <title>Winit — غير متصل</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f8f8;color:#142b31}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);padding:32px;border:1px solid #dbe5e6;border-radius:24px;background:#fff;box-shadow:0 12px 36px #142b3110;text-align:center}h1{font-size:1.5rem;margin:0 0 12px}p{line-height:1.8;color:#52666b;margin:0 0 22px}button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#126b73;color:#fff;font:inherit;font-weight:700;cursor:pointer}@media(prefers-color-scheme:dark){:root{background:#0b1a20;color:#e7f0f0}.card{background:#12252b;border-color:#294047}p{color:#b3c5c8}}
  </style>
</head>
<body>
  <main class="card">
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>تعذّر الاتصال الآن. عند عودة الإنترنت، أعد تحميل Winit لمزامنة مهامك وتحديث بياناتك.</p>
    <button type="button" onclick="location.reload()">حاول مرة أخرى</button>
  </main>
  <script>
    try {
      const language = localStorage.getItem('winit-language');
      if (language === 'en') {
        document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
        document.title = 'Winit — Offline';
        document.querySelector('h1').textContent = 'You are offline';
        document.querySelector('p').textContent = 'Winit could not connect. When you are back online, reload to sync your tasks and refresh your data.';
        document.querySelector('button').textContent = 'Try again';
      }
    } catch (_) {}
  </script>
</body>
</html>
