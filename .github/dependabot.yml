version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch bumps, so the queue stays readable.
      patch-and-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
